<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>診断が完了しました｜電気代削減シミュレーション｜みんなの住まい</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
:root{color-scheme:light;--navy:#14284b;--ink:#1c232d;--sub:#5b6573;--line:#d6dde6;--bg:#eef2f6;--soft:#f3f7fb;--cta:#f07a12;--red:#e0201b;--mark:#ffe55c;--gift:#c2410c;--gift-bg:#fff4ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.75}
img{display:block;max-width:100%;height:auto}
.page{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding:0 0 40px}
.hdr{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:900;color:var(--navy)}
.hdr small{display:block;font-size:9.5px;font-weight:500;color:var(--sub);line-height:1.2}
.sec{padding:24px 18px;display:grid;gap:14px;text-align:center}
h1{margin:0;font-size:24px;font-weight:900;line-height:1.4}
.lead{margin:0;font-size:14px;color:var(--sub)}
.box{border:3px solid var(--cta);border-radius:16px;padding:16px 12px;display:grid;gap:4px;background:#fffaf4}
.box .lb{justify-self:center;font-size:13px;font-weight:900;color:#fff;background:var(--cta);border-radius:999px;padding:2px 16px}
.box .amt{font-size:15px;font-weight:700}
.box .amt b{font-size:46px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.2}
.box .yr{font-size:15px;font-weight:700}
.box .yr b{background:linear-gradient(transparent 60%,var(--mark) 60%);font-size:19px}
.pair{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;text-align:left}
.pair p{margin:0;font-weight:700;font-size:14px}
.fine{margin:0;font-size:11px;color:var(--sub);text-align:left;line-height:1.6}
.notarget{border:2px solid var(--red);border-radius:12px;padding:12px;text-align:left;font-size:14px;background:#fff5f5}
.phone{border:2px solid var(--cta);border-radius:12px;background:var(--gift-bg);padding:14px;font-size:15px;font-weight:700;line-height:1.8}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;background:var(--soft)}
.plan h2{margin:0 0 6px;font-size:16px;font-weight:900;color:var(--navy)}
.plan ul{margin:0;padding-left:1.2em}
.steps{display:grid;text-align:left;counter-reset:s}
.steps div{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;font-size:14px;font-weight:700;padding-block:6px}
.steps div::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px}
.trust{display:flex;justify-content:center;gap:14px;font-size:12px;font-weight:700;color:var(--navy)}
.btn{display:block;text-align:center;background:var(--cta);color:#fff;border-radius:999px;padding:14px;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">みんなの住まい<small>太陽光パネル＋蓄電池の無料診断</small></div>
  <main id="out" class="sec"></main>
</div>
<script>
(function(){
  window.dataLayer = window.dataLayer || [];
  let d = null;
  try { d = JSON.parse(sessionStorage.getItem('diagResult') || 'null'); } catch(e){}
  // 確認用：?demo=1 でサンプル表示
  if(!d && new URLSearchParams(location.search).has('demo')){
    d = {isTarget:true, q1text:'2万〜3万円', save:5000, year:60000, q3text:'太陽光発電', q4text:'3ヶ月以内', interest:'pv',
      plan:{h:'太陽光でどれだけ下がるか', items:['屋根に何kW載せられるか','発電した電気をどれだけ自宅で使えるか','余った電気を売った場合の収入']}};
  }
  const out = document.getElementById('out');
  const el = (t,c,txt) => { const e = document.createElement(t); if(c) e.className = c; if(txt != null) e.textContent = txt; return e; };
  if(!d || !d.save){
    out.append(el('h1','','診断結果が見つかりませんでした'), el('p','lead','お手数ですが、もう一度シミュレーションからお試しください。'));
    const a = el('a','btn','シミュレーションをやり直す'); a.href = 'index.html#sim'; out.append(a);
    return;
  }
  window.dataLayer.push({event:'form_complete', lp:'漫画LP', is_target:d.isTarget});
  const yen = n => (n || 0).toLocaleString('ja-JP');

  out.append(el('h1','','診断が完了しました！'), el('p','lead','ご回答内容から、電気代の削減目安を算出しました。'));

  const box = el('div','box');
  box.append(el('span','lb','あなたの想定削減額'));
  const amt = el('p','amt'); amt.style.margin = '0';
  amt.append('月々 約', el('b','',yen(d.save)), '円〜');
  const yr = el('p','yr'); yr.style.margin = '0';
  yr.append('年間では ', el('b','','約' + yen(d.year) + '円'), ' の削減が期待できます');
  box.append(amt, yr);
  out.append(box);
  out.append(el('p','fine','※ご回答いただいた電気代（' + d.q1text + '）をもとにした目安です。ご自宅の条件・設備・電気の使い方によって変わります。'));

  if(!d.isTarget){
    const n = el('div','notarget');
    n.append('ご入力ありがとうございます。恐れ入りますが、本サービスは', el('b','','戸建てにお住まいの方'), 'を対象としております。他のご提案が可能な場合は担当者よりご連絡いたします。');
    out.append(n);
  }

  const pair = el('div','pair');
  const img = el('img'); img.src = 'S02_sim_result.webp'; img.alt = ''; img.width = 800; img.height = 800;
  pair.append(img, el('p','','補助金を使った費用と、元が取れる年数は、無料の診断書でお出しします。'));
  out.append(pair);

  out.append(el('div','phone','📞 1分程度のお電話で、診断書のご案内とAmazonギフト券のお渡し方法をお伝えします'));

  if(d.plan){
    const pl = el('div','plan');
    pl.append(el('h2','','お電話でご案内すること：' + d.plan.h));
    const ul = el('ul'); d.plan.items.forEach(t => ul.append(el('li','',t)));
    pl.append(ul); out.append(pl);
  }

  const st = el('div','steps');
  [['お電話でご状況を確認'],['現地調査（1〜2時間・無料）'],['診断書とお見積もりをご説明'],['ご家族で相談して決める']].forEach(([t]) => st.append(el('div','',t)));
  out.append(el('p','lead','このあとの流れ'), st);
  out.append(el('p','fine','※その場で契約を急かすことはありません。'));

  const tr = el('div','trust'); ['🔒 SSL暗号化','📞 しつこい営業なし','💰 完全無料'].forEach(t => tr.append(el('span','',t)));
  out.append(tr);
})();
</script>
</body>
</html>
